name: Backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Tests and packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Tests
        run: ./mvnw -B verify

      # The image is built on every change so that a broken Dockerfile is caught here and not
      # at deployment time.
      - name: Container image
        run: docker build -t similar-products:ci .
