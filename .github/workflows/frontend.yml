name: Frontend

on:
  push:
    branches: [main]
  pull_request:

# Cancels the previous run of the same branch: only the latest commit is of interest.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile pins and fails
      # if that does not match package.json.
      - run: npm ci

      - name: Code checks
        run: npm run lint

      - name: Type checks
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      # The CSP only applies to the production build, so a mistake in it does not show up in
      # development: it breaks in the user's browser, silently. This step checks against the
      # built HTML that the policy covers everything the page actually loads.
      - name: Content-Security-Policy verification
        run: npm run check:csp

      # The README says the API URL is configurable. This step is what keeps that claim true: the
      # whole build and its policy check run again against a different origin. That combination
      # used to fail, because the connection hints were hard-coded in index.html while the policy
      # was generated from the configuration, and nobody had ever run the two together.
      - name: Build and verify with a configured API origin
        run: npm run build && npm run check:csp
        env:
          VITE_API_BASE_URL: https://api.example.test

      # Every number the README states, checked against reality. It is here because the pattern
      # this project had to be told about was documenting as done what had not been verified, and
      # the fix for that is not care: it is a command. See "Every claim here has a command that
      # proves it" in the README.
      #
      # It runs after the build because one of the claims it verifies is about the built HTML.
      - name: README claims
        run: npm run check:claims

      # Known vulnerabilities in the dependencies. Limited to production ones: a warning in a
      # development tool never reaches the user.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
