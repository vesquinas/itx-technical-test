name: Frontend

on:
  push:
    branches: [main]
  pull_request:

# Cancels the previous run of the same branch: only the latest commit is of interest.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile pins and fails
      # if that does not match package.json.
      - run: npm ci

      - name: Code checks
        run: npm run lint

      - name: Type checks
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      # The CSP only applies to the production build, so a mistake in it does not show up in
      # development: it breaks in the user's browser, silently. This step checks against the
      # built HTML that the policy covers everything the page actually loads.
      - name: Content-Security-Policy verification
        run: npm run check:csp

      # Known vulnerabilities in the dependencies. Limited to production ones: a warning in a
      # development tool never reaches the user.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
