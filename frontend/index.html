<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mobile Store — Catálogo de teléfonos</title>
    <meta
      name="description"
      content="Catálogo de teléfonos móviles con búsqueda por marca y modelo, ficha técnica detallada y selección de color y capacidad."
    />

    <!--
      The connection to the API is opened before the code needs it: it saves the DNS resolution
      and the TLS negotiation from the critical path. With this API it counts double, because its
      first response is slow to begin with.
    -->
    <link rel="preconnect" href="https://itx-frontend-test.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://itx-frontend-test.onrender.com" />

    <!-- Tints the browser interface on mobile, in each mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
