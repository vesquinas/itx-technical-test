<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mobile Store — Catálogo de teléfonos</title>
    <meta
      name="description"
      content="Catálogo de teléfonos móviles con búsqueda por marca y modelo, ficha técnica detallada y selección de color y capacidad."
    />

    <!--
      The connection hints to the API are NOT here. They are injected at build time from the
      configured API origin, next to the Content-Security-Policy that has to allow that same
      origin — see `connectionHints` in vite.config.ts.

      They used to be hard-coded here, and that made a liar of the README: pointing
      VITE_API_BASE_URL at a different host left these two tags aimed at the old one, and the
      build's own CSP check failed because the document then referenced an origin the policy did
      not declare. One origin, one source.
    -->

    <!-- Tints the browser interface on mobile, in each mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
