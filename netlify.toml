# Deployment of the frontend on Netlify.
#
# It exists for one reason that GitHub Pages cannot cover: **the cart**. The API keeps the basket
# in a server-side session identified by an `HttpOnly` cookie, and a browser will not send that
# cookie across origins — the cookie has no `SameSite=None; Secure` and the API answers
# `Access-Control-Allow-Origin: *` with no `Access-Control-Allow-Credentials`, which forbids
# credentialed cross-origin requests outright.
#
# The only fix is to stop being cross-origin, which needs a proxy. Static hosting cannot proxy;
# Netlify can, in the rules below. With them the requests are same-origin, the browser sends the
# cookie, the session persists and the counter climbs.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22 satisfies what Vite 8 requires (^20.19.0 || >=22.12.0).
  NODE_VERSION = "22"

  # A relative base means the application asks its own origin, so the requests go through the
  # proxy below. See `resolveBaseUrl` in src/api/client.ts.
  VITE_API_BASE_URL = "/"

# The three endpoints the application uses, one rule each, and **not** a `/api/*` wildcard.
#
# A wildcard here would forward anything under `/api/` to that host, which makes this deployment a
# relay anyone could point at it. It is a public API and the cost is bandwidth rather than a
# security hole — nothing here holds a credential to lend — but a relay for three known paths is
# strictly better than a relay for any path, and it costs two extra rules.
#
# `:productId` matches a single path segment, so `/api/product/a/b` is not proxied either.
#
# Order matters: these have to come before the SPA fallback, or `/api/...` would be answered with
# index.html.
[[redirects]]
  from   = "/api/product"
  to     = "https://itx-frontend-test.onrender.com/api/product"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/product/:productId"
  to     = "https://itx-frontend-test.onrender.com/api/product/:productId"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/cart"
  to     = "https://itx-frontend-test.onrender.com/api/cart"
  status = 200
  force  = true

# Anything else under `/api/` is not ours to forward. It answers 404 with the application's own
# page rather than falling through to the SPA fallback below, which would answer 200 and pretend
# the path exists.
[[redirects]]
  from   = "/api/*"
  to     = "/index.html"
  status = 404

# A missing asset is a missing asset, not a page.
#
# Without this the SPA fallback below answers **200 with the application's HTML** for anything under
# `/assets/`, which is how a request for a source map that no longer exists came back with a 200 and
# 2.7 kB of markup. Static files still win over this rule — it has no `force` — so the real bundles
# are served normally and only what does not exist reaches it.
[[redirects]]
  from   = "/assets/*"
  to     = "/index.html"
  status = 404

# SPA fallback. Unlike the 404.html trick that static hosting forces, this answers **200**, so a
# deep link such as /product/<id> is a proper page and not an error page that happens to render.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# The headers a Content-Security-Policy in a `<meta>` tag cannot express.
#
# The policy itself stays in the built HTML rather than being duplicated here: two copies of the
# same policy are two things to keep in step, and a divergence between them would silently break
# the application. What is added here is only what the meta tag has no way of doing.
[[headers]]
  for = "/*"

  [headers.values]
    # The equivalent of `frame-ancestors 'none'`, which is ignored in a meta tag. Clickjacking.
    X-Frame-Options = "DENY"

    # Stops the browser from second-guessing the declared content type.
    X-Content-Type-Options = "nosniff"

    # The API and the images are on another origin; there is no reason to tell them where the
    # visit came from.
    Referrer-Policy = "no-referrer"

    Strict-Transport-Security = "max-age=31536000"
