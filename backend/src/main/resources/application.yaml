server:
  port: 5000
  # The server and its version are not advertised in the responses: that information only
  # serves whoever is looking for a known vulnerability.
  server-header: ""
  shutdown: graceful
  tomcat:
    # Generous accept queue: the load test starts 200 users at once and rejecting
    # connections during that ramp-up is not helpful.
    accept-count: 200
    max-connections: 10000

spring:
  application:
    name: similar-products
  threads:
    # One virtual thread per request. With this, the server needs no hand-sized pool and
    # blocking on the network stops being expensive.
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  mvc:
    problemdetails:
      enabled: true

existing-api:
  base-url: http://localhost:3001

  # Connecting is either fast or it does not happen: if the source is down, better to know now.
  connect-timeout: 1s

  # Per-call limit. Chosen above the product that takes 5 seconds in the mock, so that it gets
  # to answer and be cached; and well below the one that takes 50, which is never worth the wait.
  read-timeout: 6s

  # Budget for the whole request, and deliberately short. Whatever does not arrive within it is
  # left out of the response, but its call keeps running and will leave the product in the cache
  # for subsequent requests.
  #
  # This value fixes the service's worst case, which is why it is chosen below one second:
  # similar products are a complement to the product page, not its main content, and no user
  # should wait longer than that for a complement.
  #
  # Measured with the load test, against a 1500ms budget: the mean drops from 123ms to 92ms, the
  # worst case from 1.53s to 649ms and throughput rises from 270 to 285 requests per second.
  # Completeness does not suffer: once the cache is warm, responses carry every reachable
  # similar product again.
  fan-out-timeout: 600ms

  # How long a good result is kept.
  success-ttl: 5m

  # A product not existing is stable, so it is remembered for a while.
  missing-ttl: 1m

  # A failure is transient: remembered for a few seconds only and then retried. This is what
  # acts as a circuit breaker with per-product granularity.
  unavailable-ttl: 10s

  # Cap on the similar products resolved per request. It bounds the amplification: without it,
  # ONE request to this service turns into as many calls to the source as the list has entries,
  # and that number is decided by the source and not by us. The list comes ordered by
  # similarity, so the trim keeps the closest matches.
  max-similar-products: 50

management:
  server:
    # The management endpoints live on their own port, which in a real deployment stays
    # reachable only from the internal network. The public port (5000) serves nothing but
    # the API.
    #
    # This matters more than it looks: /actuator/metrics lets you enumerate 44 metrics without
    # authenticating, among them free disk space and JVM internals. That is information no
    # client needs and someone probing the system does.
    port: 5001
  endpoints:
    web:
      exposure:
        # And even there, only what is needed: exposing them all publishes the configuration,
        # the environment variables and thread and heap dumps.
        include: health,info,metrics
  endpoint:
    health:
      # The details enumerate the services the system depends on.
      show-details: never

logging:
  level:
    com.itx.similarproducts: INFO
